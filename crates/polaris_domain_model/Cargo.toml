[package]
name = "polaris_domain_model"
version.workspace = true
description = "Domain-model harness building blocks for Polaris agents: pre-flight guard, what-if tool, handbook injection, belief state, and file-based harness config"
edition.workspace = true
documentation = "https://docs.rs/polaris-ai"
keywords = ["polaris-ai", "agents", "mcp", "guardrails", "llm"]
categories = ["asynchronous", "development-tools"]
license.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
polaris_system = { path = "../polaris_system", version = "0.6" }
polaris_tools = { path = "../polaris_tools", version = "0.6" }
polaris_models = { path = "../polaris_models", version = "0.6" }
polaris_mcp = { path = "../polaris_mcp", version = "0.6" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "1"
tracing = "0.1"

[dev-dependencies]
rmcp = { version = "3.8", default-features = false, features = ["client", "server"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "io-util"] }
# Needed by integration tests under `cargo test --workspace --all-features`:
# the unified feature resolution turns on `polaris_tools/dashboard`, which
# makes `ToolsPlugin` require `AppPlugin`.
polaris_app = { path = "../polaris_app", default-features = false }
