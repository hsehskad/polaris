[package]
name = "examples"
version = "0.0.1"
edition = "2024"
repository = "https://github.com/RadiantAILabs/polaris"
rust-version = "1.97.0"
publish = false

[features]
default = []
otel = ["polaris/otel", "polaris_app/otel"]
# The domain-model agent example: MCP tools, the domain-model harness, Bedrock.
domain-model = ["polaris/mcp", "polaris/domain-model", "polaris/bedrock"]

[[bin]]
name = "domain_model_agent"
path = "src/bin/domain_model_agent.rs"
required-features = ["domain-model"]

[lints.rust]
missing_docs = "allow"

[dependencies]
polaris = { path = "..", package = "polaris-ai" }
polaris_app = { path = "../crates/polaris_app", default-features = false }
polaris_sessions = { path = "../crates/polaris_sessions", features = ["sessions-http"] }
axum = "0.8"
dotenvy = "0.15"
rustyline = "17.0.2"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
